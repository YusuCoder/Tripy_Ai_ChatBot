<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripy - Smart Trip Planner</title>
    <link rel="icon" href="✈️" type="image/x-icon">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Professional Blue/Teal Palette */
            --primary-color: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --secondary-color: #0891b2;
            --secondary-hover: #0e7490;
            --secondary-light: #cffafe;
            --accent-color: #06b6d4;
            --accent-hover: #0891b2;
            --accent-light: #a5f3fc;
            
            /* Enhanced color system */
            --teal-50: #f0fdfa;
            --teal-100: #ccfbf1;
            --teal-200: #99f6e4;
            --teal-300: #5eead4;
            --teal-400: #2dd4bf;
            --teal-500: #14b8a6;
            --teal-600: #0d9488;
            --teal-700: #0f766e;
            --teal-800: #115e59;
            --teal-900: #134e4a;
            
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --blue-200: #bfdbfe;
            --blue-300: #93c5fd;
            --blue-400: #60a5fa;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --blue-800: #1e40af;
            --blue-900: #1e3a8a;
            
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            
            /* Background System */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-chat: linear-gradient(135deg, #f0f9ff 0%, #f0fdfa 100%);
            --bg-sidebar: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            --bg-header: rgba(255, 255, 255, 0.95);
            --bg-message-user: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            --bg-message-ai: linear-gradient(135deg, var(--teal-50) 0%, var(--blue-50) 100%);
            
            /* Text Colors */
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --text-white: #ffffff;
            
            /* Border System */
            --border-color: rgba(148, 163, 184, 0.2);
            --border-hover: rgba(148, 163, 184, 0.3);
            --border-focus: var(--primary-color);
            
            /* Shadow System */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-blue: 0 10px 15px -3px rgba(59, 130, 246, 0.1), 0 4px 6px -4px rgba(59, 130, 246, 0.1);
            --shadow-teal: 0 10px 15px -3px rgba(20, 184, 166, 0.1), 0 4px 6px -4px rgba(20, 184, 166, 0.1);
            
            /* Radius System */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-3xl: 2rem;
            
            /* Layout */
            --sidebar-width: 320px;
            --header-height: 70px;
            
            /* Animations */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-chat: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --bg-sidebar: linear-gradient(180deg, #1e293b 0%, #334155 100%);
            --bg-header: rgba(15, 23, 42, 0.95);
            --bg-message-user: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            --bg-message-ai: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.8) 100%);
            
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --text-light: #475569;
            
            --border-color: rgba(148, 163, 184, 0.1);
            --border-hover: rgba(148, 163, 184, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            font-feature-settings: 'cv03', 'cv04', 'cv11';
        }
        
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: var(--bg-chat);
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-normal);
            position: relative;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }
        
        .sidebar-header {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-white);
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .new-chat-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left var(--transition-slow);
        }
        
        .new-chat-btn:hover::before {
            left: 100%;
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-blue);
        }
        
        .new-chat-btn:active {
            transform: translateY(0);
        }
        
        .sessions-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }
        
        .sessions-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .sessions-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .sessions-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .sessions-container::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
        
        .session-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
        }
        
        .session-item:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--border-hover);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }
        
        .session-item.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-white);
            border-color: var(--primary-hover);
            box-shadow: var(--shadow-blue);
        }
        
        .session-item .session-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.875rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-secondary);
        }
        
        .session-item.active .session-name {
            color: var(--text-white);
            font-weight: 600;
        }
        
        .session-item .delete-btn {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.6;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .session-item .delete-btn:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            transform: scale(1.1);
        }
        
        .sidebar-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .status-indicators {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: relative;
        }
        
        .status-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.success { 
            background: var(--success-color);
        }
        
        .status-indicator.success::after {
            background: var(--success-color);
        }
        
        .status-indicator.warning { 
            background: var(--warning-color);
        }
        
        .status-indicator.warning::after {
            background: var(--warning-color);
        }
        
        .status-indicator.error { 
            background: var(--error-color);
        }
        
        .status-indicator.error::after {
            background: var(--error-color);
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            70% {
                transform: scale(1.5);
                opacity: 0;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-chat);
        }
        
        .chat-header {
            height: var(--header-height);
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 50;
        }
        
        .chat-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .chat-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .chat-title .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-white);
            font-size: 1.25rem;
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .theme-toggle, .sidebar-toggle {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .theme-toggle::before, .sidebar-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            opacity: 0;
            transition: opacity var(--transition-normal);
        }
        
        .theme-toggle:hover::before, .sidebar-toggle:hover::before {
            opacity: 0.1;
        }
        
        .theme-toggle:hover, .sidebar-toggle:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .sidebar-toggle {
            display: none;
        }
        
        /* Chat Messages Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: transparent;
            scroll-behavior: smooth;
            position: relative;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
        
        .chat-messages {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding-bottom: 2rem;
        }
        
        .message {
            display: flex;
            gap: 1rem;
            animation: messageSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation-fill-mode: forwards;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .message.user .message-avatar {
            background: var(--bg-message-user);
            color: var(--text-white);
            box-shadow: var(--shadow-blue);
        }
        
        .message.user .message-avatar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--teal-500), var(--blue-500));
            color: var(--text-white);
            box-shadow: var(--shadow-teal);
        }
        
        .message-content {
            flex: 1;
            max-width: 75%;
        }
        
        .message-bubble {
            background: var(--bg-primary);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        .message.user .message-bubble {
            background: var(--bg-message-user);
            color: var(--text-white);
            border-color: transparent;
            box-shadow: var(--shadow-blue);
        }
        
        .message.assistant .message-bubble {
            background: var(--bg-message-ai);
            border-color: rgba(20, 184, 166, 0.1);
            box-shadow: var(--shadow-teal);
        }
        
        .message-text {
            margin: 0;
            line-height: 1.7;
            font-size: 0.95rem;
        }
        
        .message.user .message-text {
            color: var(--text-white);
        }
        
        .message-image {
            margin: 1rem 0;
            border-radius: var(--radius-xl);
            max-width: 320px;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .message-timestamp {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.75rem;
            font-weight: 500;
        }
        
        .message.user .message-timestamp {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 1.5rem;
            background: var(--bg-message-ai);
            border-radius: var(--radius-2xl);
            border: 1px solid rgba(20, 184, 166, 0.1);
            box-shadow: var(--shadow-teal);
        }
        
        .typing-dots {
            display: flex;
            gap: 6px;
        }
        
        .typing-dot {
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        /* Input Area */
        .input-container {
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            position: relative;
            z-index: 40;
        }
        
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        
        .input-form {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-3xl);
            padding: 1rem 1.25rem;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-lg);
        }
        
        .input-form:focus-within {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-blue);
            transform: translateY(-2px);
        }
        
        .file-upload-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .file-upload-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            opacity: 0;
            transition: opacity var(--transition-normal);
            border-radius: inherit;
        }
        
        .file-upload-btn:hover::before {
            opacity: 0.1;
        }
        
        .file-upload-btn:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }
        
        .input-textarea {
            flex: 1;
            border: none;
            background: none;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            min-height: 28px;
            max-height: 120px;
            font-family: inherit;
            font-weight: 400;
        }
        
        .input-textarea::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .send-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: var(--text-white);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        
        .send-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left var(--transition-slow);
        }
        
        .send-btn:hover::before {
            left: 100%;
        }
        
        .send-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--shadow-blue);
        }
        
        .send-btn:active {
            transform: translateY(0) scale(1);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .send-btn:disabled:hover {
            transform: none;
            box-shadow: var(--shadow-md);
        }
        
        .file-input {
            display: none;
        }
        
        .image-preview {
            position: relative;
            margin-bottom: 1rem;
        }
        
        .image-preview img {
            max-width: 200px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
        }
        
        .remove-image-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--error-color);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        
        /* Animations */
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes typingDot {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            30% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 280px;
                --header-height: 60px;
            }
            
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 1000;
                box-shadow: var(--shadow-xl);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .sidebar-toggle {
                display: flex !important;
            }
            
            .chat-title h1 {
                font-size: 1.25rem;
            }
            
            .chat-title .logo-icon {
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .message-avatar {
                width: 36px;
                height: 36px;
            }
            
            .input-container {
                padding: 1.25rem;
            }
            
            .input-form {
                padding: 0.875rem 1rem;
            }
            
            .chat-container {
                padding: 1.25rem;
            }
            
            .chat-messages {
                gap: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .chat-title h1 {
                font-size: 1.125rem;
            }
            
            .message-content {
                max-width: 90%;
            }
            
            .input-container {
                padding: 1rem;
            }
            
            .chat-container {
                padding: 1rem;
            }
        }
        
        /* Sidebar Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-normal);
        }
        
        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Loading States */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Scrollbar Styling */
        .chat-container::-webkit-scrollbar,
        .sessions-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track,
        .sessions-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-container::-webkit-scrollbar-thumb,
        .sessions-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover,
        .sessions-container::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-comments"></i> Chat Sessions</h2>
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i>
                    New Chat
                </button>
            </div>
            
            <div class="sessions-container" id="sessionsContainer">
                <!-- Sessions will be populated here -->
            </div>
            
            <div class="sidebar-footer">
                <div class="status-indicators">
                    <div class="status-item">
                        <div class="status-indicator success" id="apiStatus"></div>
                        <span>API Connection</span>
                    </div>
                    <div class="status-item">
                        <div class="status-indicator warning" id="visionStatus"></div>
                        <span>Image Processing</span>
                    </div>
                    <div class="status-item">
                        <div class="status-indicator success" id="dbStatus"></div>
                        <span>Database</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="main-container">
            <div class="chat-header">
                <div class="chat-title">
                    <div class="logo-icon">
                        <i class="fas fa-plane"></i>
                    </div>
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Tripy AI Assistant</h1>
                </div>
                <div class="header-controls">
                    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be populated here -->
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-wrapper">
                    <div class="image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" src="" alt="Preview">
                        <button class="remove-image-btn" id="removeImageBtn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="input-form">
                        <button class="file-upload-btn" id="fileUploadBtn" title="Upload image">
                            <i class="fas fa-image"></i>
                        </button>
                        <textarea 
                            class="input-textarea" 
                            id="messageInput" 
                            placeholder="Ask me anything about your trip... e.g., 'Plan a 4-day trip to Paris for €2000'"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" title="Send message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    
                    <input type="file" class="file-input" id="fileInput" accept="image/*">
                </div>
            </div>
        </div>
    </div>
    
    <script src="chat-interface.js"></script>
</body>
</html>
